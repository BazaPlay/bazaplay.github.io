<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BazaPlay — Browser & Android Games</title>
<meta name="description" content="BazaPlay builds lightweight, fast browser-based games for Android.">
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#8b98a5; --accent:#39d0d8; --card:#141b23; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:48px 20px; }
  main { width:100%; max-width:640px; }
  h1 { font-size:2.4rem; margin:0 0 4px; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  .tagline { color:var(--muted); margin:0 0 40px; }
  h2 { font-size:1rem; text-transform:uppercase; letter-spacing:0.08em;
       color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid #202b36; border-radius:12px;
          padding:20px 22px; margin-bottom:14px; }
  .card h3 { margin:0 0 6px; font-size:1.15rem; }
  .card p { margin:0 0 14px; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  footer { margin-top:48px; padding-top:20px; border-top:1px solid #202b36;
           color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Baza<span>Play</span></h1>
  <p class="tagline">Lightweight games, built for the browser and shipped to Android.</p>

  <h2>Games</h2>
  <div class="card">
    <h3>Circuit Flow</h3>
    <p>https://bazaplay.github.io/app-ads.txt.</p>
    <a href="https://play.google.com/store/apps/details?id=com.circuitflow.game">Get it on Google Play →</a>
  </div>

  <footer>
    Contact: <a href="mailto:zakbaz68@gmail.com">zakbaz68@gmail.com</a><br>
    <a href="privacy.html">Privacy Policy</a><br>
    © 2026 BazaPlay
  </footer>
</main>
</body>
</html>
